name: Jednorazowe utwardzenie zapisu licznika

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harden-counter-submit-once.yml

permissions:
  contents: write

jobs:
  harden-counter:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wyłącz ryzykowne automatyczne ponawianie głosu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('assets/js/app.js')
          app = app_path.read_text(encoding='utf-8')

          old = '''  } catch (error) {
    const serverRejectedRequest = error?.status === 429 || error?.status >= 500;

    if (serverRejectedRequest) {
      const retryDelay = error?.status === 429 && error?.retryAfter
        ? Math.max(SUPPORT_RETRY_DELAY_MS, error.retryAfter * 1000)
        : SUPPORT_RETRY_DELAY_MS;

      setPendingSupport(true);
      supportButton.disabled = false;
      supportButton.textContent = 'Oczekuje na zapis';
      if (supportStatus) {
        supportStatus.textContent = 'Serwer licznika jest chwilowo zajęty. Wsparcie zostanie wysłane automatycznie.';
      }

      window.clearTimeout(pendingSubmitTimer);
      pendingSubmitTimer = window.setTimeout(() => {
        if (hasPendingSupport() && !readStoredSupport() && navigator.onLine) {
          submitSupport({ fromPending: true });
        }
      }, retryDelay);
    } else {
      setPendingSupport(false);
      supportButton.disabled = false;
      supportButton.textContent = 'Spróbuj ponownie';
      if (supportStatus) {
        supportStatus.textContent = 'Nie udało się potwierdzić zapisu. Sprawdź internet i spróbuj ponownie.';
      }
    }

    logCounter('FINAL FAILURE', {
      operation: 'submit',
      place: 'submitSupport',
      reason: error?.message,
      stack: error?.stack,
      possibleImpact: serverRejectedRequest
        ? 'Zapis został bezpiecznie odłożony do ponowienia.'
        : 'Serwer nie potwierdził zapisu; żądanie nie jest automatycznie ponawiane, aby uniknąć podwójnego głosu.'
    });
'''

          new = '''  } catch (error) {
    // Po wysłaniu żądania nie ponawiamy go automatycznie nawet przy 429 lub 5xx.
    // CounterAPI v1 nie obsługuje kluczy idempotencji, więc ponowienie mogłoby
    // dodać tę samą osobę drugi raz, gdy serwer zapisał zmianę przed błędem odpowiedzi.
    setPendingSupport(false);
    supportButton.disabled = false;
    supportButton.textContent = 'Sprawdź i spróbuj ponownie';
    if (supportStatus) {
      supportStatus.textContent = 'Nie udało się potwierdzić zapisu. Odśwież stronę i sprawdź licznik przed ponownym kliknięciem.';
    }

    window.setTimeout(() => loadSupportCount({ force: true }), 1500);

    logCounter('FINAL FAILURE', {
      operation: 'submit',
      place: 'submitSupport',
      reason: error?.message,
      stack: error?.stack,
      possibleImpact: 'Nie potwierdzono wyniku żądania. Automatyczne ponowienie jest wyłączone, aby uniknąć podwójnego głosu.'
    });
'''

          if old not in app:
              raise SystemExit('Nie znaleziono oczekiwanego bloku obsługi błędu licznika.')

          app_path.write_text(app.replace(old, new), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_version = 'assets/js/app.js?v=36'
          new_version = 'assets/js/app.js?v=37'
          if old_version not in index:
              raise SystemExit(f'Nie znaleziono {old_version} w index.html')
          index_path.write_text(index.replace(old_version, new_version), encoding='utf-8')
          PY

      - name: Sprawdź składnię JavaScript
        run: node --check assets/js/app.js

      - name: Usuń jednorazowy workflow i zapisz zmiany
        shell: bash
        run: |
          rm .github/workflows/harden-counter-submit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js index.html .github/workflows/harden-counter-submit-once.yml
          git commit -m "Wyłącz ryzykowne automatyczne ponawianie głosu"
          git push origin HEAD:main
