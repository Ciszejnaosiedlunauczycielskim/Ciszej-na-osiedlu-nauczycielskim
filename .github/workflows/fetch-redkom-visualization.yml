name: Pobierz wizualizację Redkom

on:
  push:
    branches:
      - chatgpt/przebudowa-strony-petycja-2026
    paths:
      - .github/workflows/fetch-redkom-visualization.yml

permissions:
  contents: write

jobs:
  fetch-image:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: chatgpt/przebudowa-strony-petycja-2026

      - name: Pobierz materiał ze strony inwestora
        run: |
          set -euo pipefail
          mkdir -p assets/img
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0" \
            "https://redkomdevelopment.com/wp-content/uploads/2026/03/PL_Tarnow_3Small_Version.jpg" \
            --output assets/img/wizualizacja-parku-handlowego-lwowska-redkom.jpg
          test -s assets/img/wizualizacja-parku-handlowego-lwowska-redkom.jpg
          file assets/img/wizualizacja-parku-handlowego-lwowska-redkom.jpg | grep -qiE "JPEG|image"

      - name: Zapisz plik i usuń jednorazowy workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/wizualizacja-parku-handlowego-lwowska-redkom.jpg
          git rm .github/workflows/fetch-redkom-visualization.yml
          git commit -m "Dodaj wizualizację Parku Handlowego Lwowska ze strony Redkom"
          git push origin HEAD:chatgpt/przebudowa-strony-petycja-2026
