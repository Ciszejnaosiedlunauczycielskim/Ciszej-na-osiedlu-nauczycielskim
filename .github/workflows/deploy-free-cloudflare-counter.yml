name: Wdróż darmowy licznik Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-free-cloudflare-counter
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKEND_DIR: backend/cloudflare-support
      DATABASE_NAME: ciszej-support
      WORKER_NAME: ciszej-support-api
      SITE_ORIGIN: https://ciszejnaosiedlunauczycielskim.pl
      GITHUB_PAGES_ORIGIN: https://ciszejnaosiedlunauczycielskim.github.io
      LEGACY_COUNTER_URL: https://api.counterapi.dev/v1/ciszejnaosiedlunauczycielskim-2026-7c9f1e/wsparcie/

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sprawdź wymagane sekrety
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Brak sekretu CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Brak sekretu CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Zainstaluj Wrangler
        working-directory: ${{ env.BACKEND_DIR }}
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Znajdź lub utwórz darmową bazę D1
        working-directory: ${{ env.BACKEND_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          find_database_id() {
            npx wrangler d1 list --json | node -e '
              let raw="";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const data = JSON.parse(raw);
                const rows = Array.isArray(data) ? data : (data.result || data.databases || []);
                const item = rows.find(row => row.name === process.env.DATABASE_NAME);
                if (item) process.stdout.write(String(item.uuid || item.id || item.database_id || ""));
              });
            '
          }

          DB_ID="$(find_database_id)"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$DATABASE_NAME" --location=eeur
            DB_ID="$(find_database_id)"
          fi

          test -n "$DB_ID" || { echo 'Nie udało się ustalić identyfikatora bazy D1'; exit 1; }
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "Baza D1 gotowa: $DATABASE_NAME"

      - name: Utwórz konfigurację Workera
        working-directory: ${{ env.BACKEND_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.toml <<TOML
          name = "$WORKER_NAME"
          main = "src/index.js"
          compatibility_date = "2026-07-26"
          workers_dev = true
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          [vars]
          ALLOWED_ORIGIN = "$SITE_ORIGIN"
          GITHUB_PAGES_ORIGIN = "$GITHUB_PAGES_ORIGIN"

          [[d1_databases]]
          binding = "DB"
          database_name = "$DATABASE_NAME"
          database_id = "$D1_DATABASE_ID"
          migrations_dir = "migrations"

          [[ratelimits]]
          name = "SUPPORT_RATE_LIMITER"
          namespace_id = "1001"

            [ratelimits.simple]
            limit = 5
            period = 60
          TOML

      - name: Odczytaj aktualną wartość starego licznika bez dodawania głosu
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 20 \
            "$LEGACY_COUNTER_URL?migration=$(date +%s)" > /tmp/legacy-counter.json

          LEGACY_VALUE="$(node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/legacy-counter.json', 'utf8'));
          const candidates = [
            payload?.value, payload?.count, payload?.Count, payload?.up_count,
            payload?.data?.value, payload?.data?.count, payload?.data?.Count, payload?.data?.up_count
          ];
          const value = candidates.find(item => Number.isFinite(Number(item)));
          if (value === undefined || Number(value) < 0) process.exit(1);
          process.stdout.write(String(Math.trunc(Number(value))));
          NODE
          )"

          test -n "$LEGACY_VALUE" || { echo 'Stary licznik nie zwrócił poprawnej wartości'; exit 1; }
          echo "LEGACY_VALUE=$LEGACY_VALUE" >> "$GITHUB_ENV"
          echo "Wartość przed migracją: $LEGACY_VALUE"

      - name: Zainicjalizuj D1 bez zerowania istniejących danych
        working-directory: ${{ env.BACKEND_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          value = os.environ['LEGACY_VALUE']
          source = Path('migrations/0001_init.sql').read_text(encoding='utf-8')
          source = source.replace('__MIGRATED_COUNTER_VALUE__', value)
          source = source.replace('INSERT INTO support_state', 'INSERT OR IGNORE INTO support_state')
          Path('/tmp/0001_init_runtime.sql').write_text(source, encoding='utf-8')
          PY

          npx wrangler d1 execute "$DATABASE_NAME" \
            --remote \
            --yes \
            --file /tmp/0001_init_runtime.sql \
            --config wrangler.toml

          npx wrangler d1 execute "$DATABASE_NAME" \
            --remote \
            --json \
            --command "SELECT base_count + (SELECT COUNT(*) FROM support_votes) AS value FROM support_state WHERE id = 1;" \
            --config wrangler.toml > /tmp/d1-count.json

          D1_VALUE="$(node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/d1-count.json', 'utf8'));
          function findValue(node) {
            if (!node || typeof node !== 'object') return null;
            if (Number.isFinite(Number(node.value))) return Math.trunc(Number(node.value));
            for (const value of Object.values(node)) {
              if (Array.isArray(value)) {
                for (const item of value) {
                  const found = findValue(item);
                  if (found !== null) return found;
                }
              } else {
                const found = findValue(value);
                if (found !== null) return found;
              }
            }
            return null;
          }
          const value = findValue(data);
          if (value === null || value < 0) process.exit(1);
          process.stdout.write(String(value));
          NODE
          )"

          test -n "$D1_VALUE" || { echo 'Nie udało się odczytać wartości z D1'; exit 1; }
          echo "D1_VALUE=$D1_VALUE" >> "$GITHUB_ENV"
          echo "Wartość w D1 przed przełączeniem: $D1_VALUE"

      - name: Sprawdź składnię i wdróż Worker
        working-directory: ${{ env.BACKEND_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          npx wrangler deploy --config wrangler.toml 2>&1 | tee /tmp/wrangler-deploy.log

          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1 || true)"
          test -n "$WORKER_URL" || { echo 'Nie udało się odczytać adresu workers.dev z wyniku wdrożenia'; exit 1; }
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "Worker wdrożony: $WORKER_URL"

      - name: Sprawdź odczyt i CORS nowego backendu
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --max-time 20 \
            -D /tmp/worker-headers.txt \
            -H "Origin: $SITE_ORIGIN" \
            "$WORKER_URL/support/count?audit=$(date +%s)" > /tmp/worker-count.json

          WORKER_VALUE="$(node -e '
            const fs=require("fs");
            const value=Number(JSON.parse(fs.readFileSync("/tmp/worker-count.json","utf8"))?.value);
            if(!Number.isFinite(value)) process.exit(1);
            process.stdout.write(String(Math.trunc(value)));
          ')"

          CORS="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/\r$/, ""); print $2}' /tmp/worker-headers.txt | tail -1)"
          test "$CORS" = "$SITE_ORIGIN" || { echo "Nieprawidłowy CORS: ${CORS:-brak}"; exit 1; }
          test "$WORKER_VALUE" = "$D1_VALUE" || { echo "Niezgodność migracji: D1=$D1_VALUE Worker=$WORKER_VALUE"; exit 1; }
          echo "WORKER_VALUE=$WORKER_VALUE" >> "$GITHUB_ENV"

      - name: Podłącz bezpieczny backend do strony
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          worker_url = os.environ['WORKER_URL'].rstrip('/')
          template_path = Path('backend/cloudflare-support/frontend-app.template.js')
          template = template_path.read_text(encoding='utf-8')
          if '__SUPPORT_API_BASE__' not in template:
              raise SystemExit('Brak placeholdera adresu Workera w szablonie frontendu')

          # Zabezpiecza synchronizację wielu kart przed pętlą BroadcastChannel.
          template = template.replace(
              'function storeCachedCount(value) {',
              'function storeCachedCount(value, { broadcast = true } = {}) {'
          )
          template = template.replace(
              "  supportChannel?.postMessage({ type: 'counter', ...cached });\n  return cached.value;",
              "  if (broadcast) supportChannel?.postMessage({ type: 'counter', ...cached });\n  return cached.value;"
          )
          template = template.replace(
              'renderCount(storeCachedCount(event.data.value));',
              'renderCount(storeCachedCount(event.data.value, { broadcast: false }));'
          )
          template_path.write_text(template, encoding='utf-8')

          app = template.replace('__SUPPORT_API_BASE__', worker_url)
          Path('assets/js/app.js').write_text(app, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          version = datetime.now(timezone.utc).strftime('cf%Y%m%d%H%M%S')
          updated, count = re.subn(r'assets/js/app\.js\?v=[^"\s]+', f'assets/js/app.js?v={version}', index)
          if count != 1:
              raise SystemExit(f'Oczekiwano jednego odwołania do app.js, znaleziono: {count}')
          index_path.write_text(updated, encoding='utf-8')
          Path('/tmp/frontend-version.txt').write_text(version, encoding='utf-8')
          PY

          node --check assets/js/app.js
          grep -q "$WORKER_URL" assets/js/app.js
          test "$(grep -o '/support/count' assets/js/app.js | wc -l)" -ge 1
          grep -q "method: 'POST'" assets/js/app.js
          grep -q "broadcast: false" assets/js/app.js
          test "$(grep -o 'api.counterapi.dev' assets/js/app.js | wc -l)" -eq 0
          FRONTEND_VERSION="$(cat /tmp/frontend-version.txt)"
          echo "FRONTEND_VERSION=$FRONTEND_VERSION" >> "$GITHUB_ENV"

      - name: Zapisz metadane migracji bez sekretów
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const report = {
            deployedAt: new Date().toISOString(),
            workerUrl: process.env.WORKER_URL,
            databaseName: process.env.DATABASE_NAME,
            legacyValueAtMigration: Number(process.env.LEGACY_VALUE),
            d1ValueBeforeSwitch: Number(process.env.D1_VALUE),
            workerValueBeforeSwitch: Number(process.env.WORKER_VALUE),
            frontendVersion: process.env.FRONTEND_VERSION,
            productionVerified: false
          };
          fs.writeFileSync('backend/cloudflare-support/deployment-status.json', JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Opublikuj frontend na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js index.html backend/cloudflare-support/frontend-app.template.js backend/cloudflare-support/deployment-status.json
          git commit -m "Przełącz licznik na darmowy backend Cloudflare"
          git push origin HEAD:main

      - name: Poczekaj na GitHub Pages i sprawdź produkcję
        shell: bash
        run: |
          set -euo pipefail
          published=0
          for attempt in $(seq 1 90); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "$SITE_ORIGIN/?counter-deploy=$(date +%s)" -o /tmp/production-index.html; then
              if grep -q "assets/js/app.js?v=$FRONTEND_VERSION" /tmp/production-index.html; then
                published=1
                break
              fi
            fi
            sleep 5
          done

          test "$published" -eq 1 || { echo 'GitHub Pages nie opublikował nowej wersji w wyznaczonym czasie'; exit 1; }

          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
            "$SITE_ORIGIN/assets/js/app.js?v=$FRONTEND_VERSION&audit=$(date +%s)" \
            -o /tmp/production-app.js

          node --check /tmp/production-app.js
          LOCAL_HASH="$(sha256sum assets/js/app.js | awk '{print $1}')"
          PROD_HASH="$(sha256sum /tmp/production-app.js | awk '{print $1}')"
          test "$LOCAL_HASH" = "$PROD_HASH" || { echo 'Produkcyjny app.js różni się od main'; exit 1; }
          grep -q "$WORKER_URL" /tmp/production-app.js

          curl -fsSL --max-time 20 \
            -H "Origin: $SITE_ORIGIN" \
            "$WORKER_URL/support/count?production-audit=$(date +%s)" \
            > /tmp/production-worker-count.json

          PRODUCTION_VALUE="$(node -e '
            const fs=require("fs");
            const value=Number(JSON.parse(fs.readFileSync("/tmp/production-worker-count.json","utf8"))?.value);
            if(!Number.isFinite(value)) process.exit(1);
            process.stdout.write(String(Math.trunc(value)));
          ')"
          echo "PRODUCTION_VALUE=$PRODUCTION_VALUE" >> "$GITHUB_ENV"
          echo "Produkcja działa. Wartość licznika: $PRODUCTION_VALUE"

      - name: Oznacz audyt jako zakończony
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'backend/cloudflare-support/deployment-status.json';
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          report.productionVerified = true;
          report.productionVerifiedAt = new Date().toISOString();
          report.productionValue = Number(process.env.PRODUCTION_VALUE);
          report.noProductionVoteWasAddedDuringTests = true;
          fs.writeFileSync(path, JSON.stringify(report, null, 2) + '\n');
          NODE

          git add backend/cloudflare-support/deployment-status.json
          git commit -m "Potwierdź produkcyjne działanie nowego licznika"
          git push origin HEAD:main
