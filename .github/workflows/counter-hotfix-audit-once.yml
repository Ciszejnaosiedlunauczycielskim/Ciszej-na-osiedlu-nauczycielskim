name: Jednorazowy hotfix i audyt licznika

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/counter-hotfix-audit-once.yml

permissions:
  contents: write

jobs:
  hotfix-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wdróż hotfix bez zmiany wyglądu strony
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('assets/js/app.js')
          app = app_path.read_text(encoding='utf-8')

          app = app.replace(
              "const SUPPORT_CACHE_KEY = 'ciszej-wsparcie-licznik-v3';",
              "const SUPPORT_CACHE_KEY = 'ciszej-wsparcie-licznik-v4';"
          )

          old = '''      const payload = await requestCounter();
          const value = extractCounterValue(payload);
          if (value === null) throw new Error('Odpowiedź licznika nie zawiera wartości.');

          storeCachedCounter(value);
          renderCount(value);
          logCounter('FINAL SUCCESS', { operation: 'load', value });'''
          new = '''      const payload = await requestCounter();
          const serverValue = extractCounterValue(payload);
          if (serverValue === null) throw new Error('Odpowiedź licznika nie zawiera wartości.');

          // Licznik jest monotoniczny. CounterAPI buforuje odczyt, dlatego po
          // poprawnie zapisanym głosie starsza odpowiedź GET nie może cofnąć
          // wartości widocznej na tym urządzeniu.
          const value = cached ? Math.max(cached.value, serverValue) : serverValue;
          storeCachedCounter(value);
          renderCount(value);
          logCounter('FINAL SUCCESS', {
            operation: 'load',
            value,
            serverValue,
            preventedRegression: Boolean(cached && serverValue < cached.value)
          });'''
          if old not in app:
              raise SystemExit('Nie znaleziono oczekiwanego fragmentu odczytu licznika')
          app = app.replace(old, new)
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_script = 'assets/js/app.js?v=36'
          new_script = 'assets/js/app.js?v=38'
          if old_script not in index:
              raise SystemExit(f'Nie znaleziono {old_script} w index.html')
          index_path.write_text(index.replace(old_script, new_script), encoding='utf-8')
          PY

      - name: Testy statyczne hotfixu
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/app.js
          python - <<'PY'
          from pathlib import Path
          app = Path('assets/js/app.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          checks = {
              'wersja app.js v38': 'assets/js/app.js?v=38' in index,
              'jedno wywołanie endpointu up': app.count("requestCounter('up')") == 1,
              'brak automatycznego ponowienia zapisu w catch': "setTimeout(() => submitSupport" not in app,
              'monotoniczny odczyt': 'Math.max(cached.value, serverValue)' in app,
              'nowy klucz cache': "ciszej-wsparcie-licznik-v4" in app,
              'komunikat po niejednoznacznym błędzie': 'Nie udało się potwierdzić zapisu. Odśwież stronę i sprawdź licznik przed ponownym kliknięciem.' in app,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL'), name)
          if failed:
              raise SystemExit('Nieudane testy: ' + ', '.join(failed))
          PY

      - name: Zapisz i opublikuj hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/counter-hotfix-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js index.html .github/workflows/counter-hotfix-audit-once.yml
          git commit -m "Napraw cache i cofanie wartości licznika"
          git push origin HEAD:main

      - name: Poczekaj na publikację GitHub Pages i sprawdź produkcję
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://ciszejnaosiedlunauczycielskim.pl'
          REPORT='/tmp/counter-production-audit.txt'
          : > "$REPORT"
          echo "AUDIT_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"

          published=0
          for i in $(seq 1 72); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$SITE/?audit=$(date +%s)" -o /tmp/index-production.html; then
              if grep -q 'assets/js/app.js?v=38' /tmp/index-production.html; then
                published=1
                break
              fi
            fi
            sleep 5
          done

          if [ "$published" -ne 1 ]; then
            echo 'OVERALL=FAIL' >> "$REPORT"
            echo 'FAIL | Produkcja nie opublikowała app.js?v=38 w wyznaczonym czasie' >> "$REPORT"
            cat "$REPORT"
            exit 1
          fi

          echo 'PASS | Produkcja ładuje app.js?v=38' >> "$REPORT"
          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$SITE/assets/js/app.js?v=38&audit=$(date +%s)" -o /tmp/app-production.js
          node --check /tmp/app-production.js
          echo 'PASS | Składnia produkcyjnego app.js' >> "$REPORT"

          local_hash=$(sha256sum assets/js/app.js | awk '{print $1}')
          prod_hash=$(sha256sum /tmp/app-production.js | awk '{print $1}')
          echo "LOCAL_APP_SHA256=$local_hash" >> "$REPORT"
          echo "PROD_APP_SHA256=$prod_hash" >> "$REPORT"
          if [ "$local_hash" = "$prod_hash" ]; then
            echo 'PASS | Produkcyjny app.js jest identyczny z main' >> "$REPORT"
          else
            echo 'FAIL | Produkcyjny app.js różni się od main' >> "$REPORT"
            exit 1
          fi

          API='https://api.counterapi.dev/v1/ciszejnaosiedlunauczycielskim-2026-7c9f1e/wsparcie/'
          curl -sS --max-time 20 -D /tmp/api-headers.txt \
            -H "Origin: $SITE" \
            "$API?audit=$(date +%s)" -o /tmp/api-body.json
          status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/api-headers.txt)
          cors=$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/\r$/, ""); print $2}' /tmp/api-headers.txt | tail -1)
          value=$(python - <<'PY'
          import json
          with open('/tmp/api-body.json', encoding='utf-8') as f:
              data=json.load(f)
          for key in ('value','count','Count','up_count'):
              if key in data:
                  print(data[key])
                  break
          else:
              nested=data.get('data') or {}
              for key in ('value','count','Count','up_count'):
                  if key in nested:
                      print(nested[key])
                      break
              else:
                  raise SystemExit('Brak wartości licznika')
          PY
          )
          echo "COUNTER_HTTP=$status" >> "$REPORT"
          echo "COUNTER_CORS=${cors:-brak}" >> "$REPORT"
          echo "COUNTER_VALUE=$value" >> "$REPORT"
          if [ "$status" = '200' ]; then
            echo 'PASS | Odczyt CounterAPI HTTP 200' >> "$REPORT"
          else
            echo "FAIL | Odczyt CounterAPI HTTP $status" >> "$REPORT"
            exit 1
          fi
          if [ "$cors" = '*' ] || [ "$cors" = "$SITE" ]; then
            echo 'PASS | CounterAPI zezwala na CORS' >> "$REPORT"
          else
            echo 'FAIL | CounterAPI nie zwróciło oczekiwanego CORS' >> "$REPORT"
            exit 1
          fi

          echo 'PASS | Nie wykonano żadnego wywołania /up' >> "$REPORT"
          echo 'OVERALL=PASS_WITH_LIMITATIONS' >> "$REPORT"
          cat "$REPORT"

          cp "$REPORT" counter-production-audit.txt
          git add counter-production-audit.txt
          git commit -m "Zapisz wynik produkcyjnego audytu licznika"
          git push origin HEAD:main
