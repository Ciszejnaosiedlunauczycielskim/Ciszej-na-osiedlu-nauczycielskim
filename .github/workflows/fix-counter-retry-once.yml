name: Jednorazowa korekta ponawiania licznika

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-counter-retry-once.yml

permissions:
  contents: write

jobs:
  fix-counter:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Usuń ryzyko podwójnego głosu po błędzie 5xx
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/app.js')
          text = path.read_text(encoding='utf-8')

          old = """    const serverRejectedRequest = error?.status === 429 || error?.status >= 500;

    if (serverRejectedRequest) {
      const retryDelay = error?.status === 429 && error?.retryAfter
        ? Math.max(SUPPORT_RETRY_DELAY_MS, error.retryAfter * 1000)
        : SUPPORT_RETRY_DELAY_MS;

      setPendingSupport(true);
      supportButton.disabled = false;
      supportButton.textContent = 'Oczekuje na zapis';
      if (supportStatus) {
        supportStatus.textContent = 'Serwer licznika jest chwilowo zajęty. Wsparcie zostanie wysłane automatycznie.';
      }

      window.clearTimeout(pendingSubmitTimer);
      pendingSubmitTimer = window.setTimeout(() => {
        if (hasPendingSupport() && !readStoredSupport() && navigator.onLine) {
          submitSupport({ fromPending: true });
        }
      }, retryDelay);
    } else {
      setPendingSupport(false);
      supportButton.disabled = false;
      supportButton.textContent = 'Spróbuj ponownie';
      if (supportStatus) {
        supportStatus.textContent = 'Nie udało się potwierdzić zapisu. Sprawdź internet i spróbuj ponownie.';
      }
    }

    logCounter('FINAL FAILURE', {
      operation: 'submit',
      place: 'submitSupport',
      reason: error?.message,
      stack: error?.stack,
      possibleImpact: serverRejectedRequest
        ? 'Zapis został bezpiecznie odłożony do ponowienia.'
        : 'Serwer nie potwierdził zapisu; żądanie nie jest automatycznie ponawiane, aby uniknąć podwójnego głosu.'
    });
"""

          new = """    // Automatyczne ponowienie jest bezpieczne wyłącznie po odpowiedzi 429,
    // która oznacza odrzucenie żądania z powodu limitu. Błędy 5xx i błędy
    // sieciowe są niejednoznaczne: serwer mógł zwiększyć licznik przed utratą
    // odpowiedzi, dlatego nie wolno automatycznie wysyłać drugiego żądania /up.
    const safeToRetryLater = error?.status === 429;

    if (safeToRetryLater) {
      const retryDelay = error?.retryAfter
        ? Math.max(SUPPORT_RETRY_DELAY_MS, error.retryAfter * 1000)
        : SUPPORT_RETRY_DELAY_MS;

      setPendingSupport(true);
      supportButton.disabled = false;
      supportButton.textContent = 'Oczekuje na zapis';
      if (supportStatus) {
        supportStatus.textContent = 'Serwer licznika osiągnął chwilowy limit. Wsparcie zostanie wysłane automatycznie.';
      }

      window.clearTimeout(pendingSubmitTimer);
      pendingSubmitTimer = window.setTimeout(() => {
        if (hasPendingSupport() && !readStoredSupport() && navigator.onLine) {
          submitSupport({ fromPending: true });
        }
      }, retryDelay);
    } else {
      setPendingSupport(false);
      supportButton.disabled = false;
      supportButton.textContent = 'Sprawdź ponownie';
      if (supportStatus) {
        supportStatus.textContent = 'Nie udało się potwierdzić zapisu. Odśwież stronę i sprawdź licznik przed kolejną próbą.';
      }
    }

    logCounter('FINAL FAILURE', {
      operation: 'submit',
      place: 'submitSupport',
      reason: error?.message,
      stack: error?.stack,
      possibleImpact: safeToRetryLater
        ? 'Żądanie zostało odrzucone przez limit i bezpiecznie odłożone do ponowienia.'
        : 'Wynik żądania jest niejednoznaczny; nie jest ono automatycznie ponawiane, aby uniknąć podwójnego głosu.'
    });
"""

          if old not in text:
              raise SystemExit('Nie znaleziono oczekiwanego bloku obsługi błędów licznika')

          path.write_text(text.replace(old, new), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          if 'assets/js/app.js?v=36' not in html:
              raise SystemExit('Nie znaleziono wersji app.js?v=36 w index.html')
          index.write_text(html.replace('assets/js/app.js?v=36', 'assets/js/app.js?v=37'), encoding='utf-8')
          PY

          node --check assets/js/app.js

      - name: Usuń workflow i zapisz poprawkę
        shell: bash
        run: |
          rm -f .github/workflows/fix-counter-retry-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/app.js index.html .github/workflows/fix-counter-retry-once.yml
          git commit -m 'Usuń ryzyko podwójnego głosu po błędzie API'
          git push origin HEAD:main
