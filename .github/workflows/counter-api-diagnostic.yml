name: CounterAPI diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check CounterAPI responses and CORS
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.counterapi.dev/v1/ciszejnaosiedlunauczycielskim-2026-7c9f1e/wsparcie'
          ORIGIN='https://ciszejnaosiedlunauczycielskim.pl'

          request() {
            local label="$1"
            local url="$2"
            local status
            status=$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 30 \
              --header "Origin: ${ORIGIN}" \
              --header 'Accept: application/json' \
              --dump-header headers.txt \
              --output body.txt \
              --write-out '%{http_code}' \
              "$url")
            echo "${label}_HTTP=${status}"
            echo "${label}_CORS=$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); print $2}' headers.txt | tail -1)"
            echo "${label}_LIMIT=$(awk 'BEGIN{IGNORECASE=1} /^x-ratelimit-limit:/ {gsub(/\r/,""); print $2}' headers.txt | tail -1)"
            echo "${label}_REMAINING=$(awk 'BEGIN{IGNORECASE=1} /^x-ratelimit-remaining:/ {gsub(/\r/,""); print $2}' headers.txt | tail -1)"
            echo "${label}_BODY=$(cat body.txt)"
          }

          request 'GET_BEFORE' "$BASE"
          request 'UP' "$BASE/up"
          request 'GET_AFTER' "$BASE"
