name: Dodatkowa walidacja strony

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pełna kontrola struktury strony
        run: python scripts/check_site.py

      - name: Sprawdź składnię JavaScript
        run: node --check assets/js/app.js
