name: Apply share text update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'share-text-noise-protection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update only share description
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/app.js')
          text = path.read_text(encoding='utf-8')
          old = "    text: 'Poznaj historię pomiarów hałasu przy Osiedlu Nauczycielskim w Tarnowie i wesprzyj inicjatywę wykonania aktualnych pomiarów.',"
          new = "    text: 'Poznaj historię pomiarów hałasu przy Osiedlu Nauczycielskim w Tarnowie i wesprzyj inicjatywę wykonania aktualnych pomiarów oraz wdrożenia zabezpieczeń przed hałasem.',"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit single-file change
        shell: bash
        run: |
          rm .github/workflows/apply-share-text.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js .github/workflows/apply-share-text.yml
          git commit -m "Update shared petition description"
          git push origin HEAD:${{ github.head_ref }}
