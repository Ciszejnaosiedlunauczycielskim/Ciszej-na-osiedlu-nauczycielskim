name: Jednorazowa aktualizacja licznika

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/counter-cache-bust.yml

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wymuś pobranie nowej wersji skryptu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'assets/js/app.js?v=35'
          new = 'assets/js/app.js?v=36'
          if old not in text:
              raise SystemExit(f'Nie znaleziono oczekiwanego odwołania: {old}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Usuń jednorazowy workflow i zapisz poprawkę
        shell: bash
        run: |
          rm .github/workflows/counter-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/counter-cache-bust.yml
          git commit -m "Wymuś pobranie naprawionej wersji licznika"
          git push origin HEAD:main
