name: Apply final counter and traffic correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'final-counter-traffic-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Roll back diagnostic counter increments
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.counterapi.dev/v1/ciszejnaosiedlunauczycielskim-2026-7c9f1e/wsparcie'
          echo "ROLLBACK_1=$(curl --silent --show-error --location --max-time 30 "$BASE/down")"
          echo "ROLLBACK_2=$(curl --silent --show-error --location --max-time 30 "$BASE/down")"
          echo "FINAL_COUNTER=$(curl --silent --show-error --location --max-time 30 "$BASE/?_=$(date +%s%N)")"

      - name: Apply exact final corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '''            <p class="context-data"><strong>Prognoza z dokumentacji:</strong> na terenie przedsięwzięcia przewidziano ruch około 6000 samochodów osobowych, 120 pojazdów dostawczych i 14 pojazdów ciężarowych na dobę. Są to wartości prognozowane, a nie wykonane pomiary.</p>'''
          new = '''            <p class="context-data">Dokumentacja inwestycji przewiduje ruch sięgający około 6000 samochodów osobowych na dobę oraz dodatkowo około 120 pojazdów dostawczych i 14 pojazdów ciężarowych. Są to wartości prognozowane, a nie wykonane pomiary. Rzeczywisty ruch będzie można ocenić dopiero po uruchomieniu obiektu.</p>'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          assert '<link rel="stylesheet" href="assets/css/style.css?v=66">' in text
          assert '<script src="assets/js/app.js?v=35" defer></script>' in text
          index.write_text(text, encoding='utf-8')

          app = Path('assets/js/app.js')
          js = app.read_text(encoding='utf-8')
          old_api = "const SUPPORT_API = 'https://api.counterapi.dev/v1/ciszejnaosiedlunauczycielskim-2026-7c9f1e/wsparcie';"
          new_api = "const SUPPORT_API = 'https://api.counterapi.dev/v1/ciszejnaosiedlunauczycielskim-2026-7c9f1e/wsparcie/';"
          assert js.count(old_api) == 1
          js = js.replace(old_api, new_api, 1)
          old_fetch = "    const response = await fetch(`${SUPPORT_API}${path}`, {"
          new_fetch = "    const endpoint = path ? new URL(path.replace(/^\\//, ''), SUPPORT_API).href : SUPPORT_API;\n    const response = await fetch(endpoint, {"
          assert js.count(old_fetch) == 1
          js = js.replace(old_fetch, new_fetch, 1)
          app.write_text(js, encoding='utf-8')
          PY

      - name: Commit corrected files
        shell: bash
        run: |
          rm .github/workflows/apply-final-counter-traffic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/app.js .github/workflows/apply-final-counter-traffic.yml
          git commit -m "Finalize verified counter endpoint and traffic wording"
          git push origin HEAD:${{ github.head_ref }}
