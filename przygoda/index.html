<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f46"><title>Razem w Przygodzie — test</title><style>html,body{margin:0;min-height:100%;background:#173f46;color:white;font-family:system-ui,sans-serif}.load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.dot{font-size:72px;animation:p 1.2s infinite}@keyframes p{50%{transform:scale(1.12)}}.err{max-width:520px;line-height:1.5}</style><script src="chunk0.js"></script><script src="chunk1.js"></script><script src="chunk2.js"></script><script src="chunk3.js"></script><script src="chunk4.js"></script><script src="chunk5.js"></script><script src="chunk6.js"></script><script src="chunk7.js"></script></head><body><main class="load" id="load"><div><div class="dot">🏮</div><h1>Uruchamiam przygodę…</h1><p>To może potrwać kilka sekund.</p></div></main><script>(async()=>{try{const s=window.__RWP.join('');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('load').innerHTML='<div class="err"><h1>Nie udało się uruchomić</h1><p>Otwórz link bezpośrednio w Safari albo Chrome, a nie w podglądzie komunikatora.</p><p>'+String(e)+'</p></div>'}})();</script></body></html>
